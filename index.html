<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบรับแจ้งอุบัติการณ์</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0fdfa;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 999;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="app-container"></div>

  <script>
    // 1. ป้องกันคีย์ลัด
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || 
         (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || 
         (e.ctrlKey && e.key.toUpperCase() === 'U')) {
        e.preventDefault();
        return false;
      }
    });

    // 2. ฟังก์ชันซ่อน URL (Obfuscation)
    (function() {
      // นำ URL ของคุณมาเข้ารหัสแบบกลับด้าน (Reverse String) 
      // URL: https://script.google.com/macros/s/......../exec
      // ตัวแปรด้านล่างนี้คือ URL ที่ถูกกลับด้านแล้ว
      const _0x1a2b = "cexe/9BmeQJKwBlE-yXtxUHTIc7tHnfuJKICJBPllP55sH0Q01yBLwP8KS4orfn6DAUUIi4wbc yfkA/s/core/moc.elgoog.tpircs//:sptth";
      
      // ทำการกลับด้านข้อความให้กลายเป็น URL ปกติ
      const gasUrl = _0x1a2b.split("").reverse().join("").replace(/ /g, ""); 
      
      const iframe = document.createElement('iframe');
      iframe.src = gasUrl;
      iframe.title = "ระบบรับแจ้งอุบัติการณ์";
      iframe.setAttribute('allow', 'camera; fullscreen');
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
      iframe.setAttribute('credentialless', 'true'); 
      
      document.getElementById('app-container').appendChild(iframe);
    })();
  </script>
</body>
</html>
