<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบรับแจ้งอุบัติการณ์</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0fdfa;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 999;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="app-container"></div>

  <script>
    // 1. ป้องกันคีย์ลัดขอดู Source code
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || 
         (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || 
         (e.ctrlKey && e.key.toUpperCase() === 'U')) {
        e.preventDefault();
        return false;
      }
    });

    // 2. สร้าง iframe
    (function() {
      const gasUrl = "https://script.google.com/macros/s/AKfycbw4iUUAD6nfroW4SK8PwLBy10Q0Hs55PlBJCuIKJufHn7tcIHTUxtXy-ElBwKJQemB9/exec";
      
      const iframe = document.createElement('iframe');
      iframe.src = gasUrl;
      iframe.title = "ระบบรับแจ้งอุบัติการณ์";
      iframe.setAttribute('allow', 'camera; fullscreen');
      iframe.setAttribute('allowfullscreen', 'true');
      
      // 💡 จุดสำคัญ: เพิ่ม sandbox และ credentialless เพื่อแก้ปัญหา Cookie และ iframe บล็อก
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
      iframe.setAttribute('credentialless', 'true'); 
      
      document.getElementById('app-container').appendChild(iframe);
    })();
  </script>
</body>
</html>
